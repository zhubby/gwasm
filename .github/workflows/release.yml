name: gwasm Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Full validation
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.event.release.tag_name }}

  release:
    name: Publish
    needs: verify
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read the release version
        id: v
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          case "$RELEASE_TAG" in
            ""|[.-]*|*[!A-Za-z0-9_.-]*)
              echo "::error::Release tag must also be a valid container tag"
              exit 1
              ;;
          esac
          test "${#RELEASE_TAG}" -le 128 || {
            echo "::error::Release tag is too long for a container tag"
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Build static documentation
        run: |
          npm ci --no-audit --no-fund
          npm run docs:check
          npm run docs:build
          test -f docs-dist/index.html
          test -f docs-dist/en/index.html
          test -f docs-dist/pagefind/wasm.en.pagefind

      - name: Assemble the package
        run: |
          set -eu
          name="gwasm-${{ steps.v.outputs.tag }}"
          mkdir -p "dist-release/$name"
          cp gwasm.py README.md LICENSE "dist-release/$name/"
          cp -r gwasm_core harness images fonts docs-dist "dist-release/$name/"
          chmod +x "dist-release/$name/gwasm.py"
          (cd dist-release && zip -qr "$name.zip" "$name")
          echo "ZIP=dist-release/$name.zip" >> "$GITHUB_ENV"

      - name: Check the extracted package
        run: |
          set -eu
          work="$(mktemp -d)"
          unzip -q "$ZIP" -d "$work"
          cd "$work"/gwasm-*
          python3 gwasm.py --help >/dev/null
          required_files="
          gwasm.py
          gwasm_core/__init__.py
          gwasm_core/http.py
          gwasm_core/patch.py
          gwasm_core/runtime.py
          gwasm_core/server.py
          harness/index.html
          harness/loading.js
          harness/harness.js
          harness/harness-cache.js
          harness/harness-module.js
          harness/harness-input.js
          harness/harness-boot.js
          harness/favicon.ico
          images/logo.webp
          fonts/Fremont.woff
          docs-dist/index.html
          docs-dist/en/index.html
          docs-dist/pagefind/wasm.en.pagefind
          LICENSE
          "
          for file in $required_files; do
            test -f "$file" || {
              echo "missing from the release: $file"
              exit 1
            }
          done

          python3 gwasm.py --no-browser --offline --no-update \
            --port 18081 --dir "$work/runtime" --cache "$work/cache" >"$work/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18081/docs/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/docs/en/ >/dev/null
          kill "$server_pid" >/dev/null 2>&1 || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}

      - name: Verify published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          for tag in "$RELEASE_TAG" latest; do
            manifest="$(docker buildx imagetools inspect --raw "$IMAGE:$tag")"
            for platform in linux/amd64 linux/arm64; do
              os="${platform%/*}"
              architecture="${platform#*/}"
              if ! jq -e --arg os "$os" --arg architecture "$architecture" 'any(.manifests[]?; .platform.os == $os and .platform.architecture == $architecture)' <<< "$manifest" >/dev/null; then
                echo "::error::$IMAGE:$tag does not contain $platform"
                exit 1
              fi
            done
          done
          docker run --rm --platform linux/amd64 "$IMAGE:$RELEASE_TAG" --help >/dev/null
          docker run --rm --platform linux/arm64 "$IMAGE:$RELEASE_TAG" --help >/dev/null
          docker run --rm --platform linux/amd64 --entrypoint sh "$IMAGE:$RELEASE_TAG" \
            -c 'test -f /app/docs-dist/index.html && test ! -w /app/docs-dist/index.html && ! command -v node && ! command -v npm'

      - name: Upload package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.v.outputs.tag }}" "$ZIP" --clobber
